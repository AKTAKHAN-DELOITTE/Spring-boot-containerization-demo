# ---------------------------------------------------------------------
# ConfigMap - externalizes the app's env vars from the Deployment spec.
# "app" service, but editable independently of the Deployment.
# ---------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: moviebooking-app-config
data:
  SPRING_MONGODB_HOST: mongodb
  SPRING_MONGODB_PORT: "27017"
  SPRING_MONGODB_DATABASE: moviebookingdb
